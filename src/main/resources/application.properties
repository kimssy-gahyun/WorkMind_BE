spring.application.name=WorkMind_BE

# Server
server.servlet.context-path=/workmind
server.port=8080

# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/workmind
spring.datasource.username=root
spring.datasource.password=mysql

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# JWT Access Token: Base64-encoded secret (minimum 32 random bytes).
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:1800}

# Optional local development secret; resolved from the project working directory.
spring.config.import=optional:file:./jwt-local.properties
